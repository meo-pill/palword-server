# Palworld Dedicated Server - Configuration Docker Compose
services:
  palworld:
    image: meopill/palworld-server:latest
    container_name: palworld-server

    stop_grace_period: 10m  # Délai d'arrêt propre du serveur Palworld

    hostname: palworld-server  # Set container hostname
    user: "3009:5000"      # Run as palworld (UID 3009) with game-server group (GID 5000)

    environment:
      - TZ=Europe/Paris
      # --- Identité du serveur ---
      - SERVER_NAME=Mon Serveur Palworld
      - SERVER_PASSWORD=ChangeME      # exemple — à remplacer
      - ADMIN_PASSWORD=StrongChangeME # exemple — à remplacer
      # --- Réseau ---
      - SERVER_PORT=8211
      - PUBLIC_IP=                    # Vide = détection automatique
      # --- Joueurs ---
      - PLAYERS=16
      # --- Visibilité ---
      - COMMUNITY=false               # true = visible dans la liste communautaire

    # Persistent volume mounts
    volumes:
      - E:\temp torrent\Nouveau_conf:/PalwordConfig                            # Configuration files
      - E:\temp torrent\Nouveau_save:/home/palword/PalwordGame/Pal/Saved        # Game saves and world data

    # Port mappings for palword server services
    ports:
      # Game connection ports (UDP/TCP)
      - "8211:8211/udp"   # Palword game ports (UDP)
      - "8211:8211/tcp"   # Palword game ports (TCP)
      # Steam query port (UDP)
      #- "27015:27015/udp" # Steam query port (UDP)
    
    restart: unless-stopped

    # Health check configuration for monitoring server status
    healthcheck:
      test: /home/palword/healthcheck.sh      # Health check script
      interval: 1m                    # Check every minute
      timeout: 30s                    # 30-second timeout per check
      retries: 3                      # Allow 3 consecutive failures
      start_period: 5m                # Grace period during startup (5 minutes)
    
    # Resource limits and reservations
    deploy:
      replicas: 1                     # Single instance
      resources:
        limits:
          cpus: '8'                   # Maximum 8 CPU cores
          memory: 16G                 # Maximum 16GB RAM

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"